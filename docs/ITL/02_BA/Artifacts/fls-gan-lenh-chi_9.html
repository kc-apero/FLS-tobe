  }else{
    var fchip=function(label,val){return h("button",{class:"fchip",type:"button","aria-pressed":state.candTier===val?"true":"false",
      onclick:function(){state.candTier=val;renderView();}},label);};
    body.appendChild(h("div",{class:"uvbar"},
      h("div",{class:"srch"},h("span",{class:"ic",text:"🔍"}),
        h("input",{id:"candSearch",type:"text",placeholder:"Tìm theo diễn giải, vendor, số CT…",value:state.candSearch,
          oninput:function(e){state.candSearch=e.target.value;state._focusSearch=true;renderView();}})),
      h("div",{class:"fchips"},fchip("Tất cả bậc","all"),fchip("Khớp mạnh 1–2","strong"),fchip("Yếu 3–4","weak"),
        h("button",{class:"fchip",type:"button","aria-pressed":state.candCur?"true":"false",
          onclick:function(){state.candCur=!state.candCur;renderView();}},"Chỉ "+o.cur))));
    body.appendChild(h("div",{class:"uv-h"},h("span"),h("span",{text:"Diễn giải · ngày · nguồn"}),h("span",{class:"rcol",text:"Số tiền · bậc"})));
    if(o.noStrong)body.appendChild(h("div",{class:"banner crit"},h("span",{text:"⛔"}),
      h("span",{},h("b",{text:"Không có ứng viên khớp đúng số tiền."})," Đọc kỹ diễn giải trước khi gán.")));
    var fc=filteredCands(o);
    if(!fc.length)body.appendChild(h("div",{class:"uvempty",text:"Không ứng viên nào khớp bộ lọc / tìm kiếm. Bỏ bớt lọc, hoặc tìm trong toàn sổ."}));
    else fc.forEach(function(x){body.appendChild(candRow(o,x.cd,x.i,false));});
    body.appendChild(h("div",{class:"uvcount"},
      h("span",{text:fc.length+"/"+o.cands.length+" ứng viên"+(o.hidden?" · máy đã ẩn "+o.hidden+" bậc yếu":"")}),
      h("button",{class:"full",type:"button",onclick:function(){alert("(demo) Tìm trên TOÀN sổ giao dịch — ngoài danh sách máy đề xuất. Dùng khi giao dịch đúng không nằm trong danh sách rút gọn.");}},"Tìm trong toàn sổ →")));
    var hasSel=state.selectedCand!=null,assigned=o.status==="dagan";
    foot=h("div",{class:"actions"},
      h("button",{class:"act primary",type:"button",disabled:hasSel?null:true,onclick:function(){doAssign(o);}},
        assigned?"Đổi sang giao dịch đã chọn":"Gán"),
      h("button",{class:"act",type:"button"},"Sang màn Sổ"),
      h("span",{class:"hint",text:hasSel?"Enter để gán · Esc để đóng":"chọn một giao dịch để gán"}));
  }
  return h("div",{class:"panelcard"},head,body,h("div",{class:"dfoot"},foot));
}
function doAssign(o){
  if(state.selectedCand==null)return;
  o.status="dagan";o.matched=o.cands[state.selectedCand];state.selectedCand=null;
  renderBand();renderFilter();
  var nxt=nextUnassigned(o.code);
  if(nxt){selectRow(nxt);}else{renderView();}
}

function renderView(){
  var root=document.getElementById("viewRoot");root.textContent="";
  var o=state.open?ORDERS.find(function(x){return x.code===state.open;}):null;
  var split=h("div",{class:"split "+(o?"two":"one")});
  split.appendChild(buildTable(!!o));
  if(o)split.appendChild(buildPanel(o));
  root.appendChild(split);
  if(o&&state._focusSearch){var el=document.getElementById("candSearch");if(el){el.focus();try{var v=el.value;el.setSelectionRange(v.length,v.length);}catch(e){}}}
  state._focusSearch=false;
}
function renderAll(){renderBand();renderFilter();renderView();}

document.getElementById("theme").addEventListener("click",function(){
  var next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);this.textContent=next==="dark"?"Nền sáng":"Nền tối";});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(state.open)closePanel();return;}
  if(!state.open){if(e.key==="ArrowDown"){e.preventDefault();var v=visible();if(v.length)selectRow(v[0].code);}return;}
  if(e.key==="ArrowDown"||e.key==="j"){e.preventDefault();moveSel(1);}
  else if(e.key==="ArrowUp"||e.key==="k"){e.preventDefault();moveSel(-1);}
  else if(e.key==="Enter"){var o=ORDERS.find(function(x){return x.code===state.open;});if(o&&state.selectedCand!=null)doAssign(o);}
});

renderAll();
</script>
</body>
</html>
